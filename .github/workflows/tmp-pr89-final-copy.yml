name: tmp-pr89-final-copy
on:
  push:
    branches: [fix/reverse-planner-actual-date-cast]
    paths: [.github/workflows/tmp-pr89-final-copy.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reverse-planner-actual-date-cast
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Align existing-plan wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/features/FixedAssigneeReversePlanner.tsx')
          text = p.read_text(encoding='utf-8')
          old1 = '? { label: "기존 확정", tone: "text-slate-700 bg-slate-100" }'
          new1 = '? { label: "기존 배정", tone: "text-slate-700 bg-slate-100" }'
          old2 = '? { label: "기존 확정", tone: "text-emerald-800 bg-emerald-50" }'
          new2 = '? { label: "기존 배정 유지", tone: "text-emerald-800 bg-emerald-50" }'
          for old, new in [(old1,new1),(old2,new2)]:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one match for {old!r}, got {text.count(old)}')
              text = text.replace(old,new,1)
          p.write_text(text, encoding='utf-8')

          t = Path('tests/preliminary-survey-confirmed-document-repair.test.ts')
          s = t.read_text(encoding='utf-8')
          marker = '  it("관리 열은 모든 행에 삭제 버튼을 렌더링하고 상세 모달의 중복 진입점은 없다", () => {\n'
          test = '''  it("자동배정 모달은 가확정 계획을 true-confirmed처럼 기존 확정이라고 표시하지 않는다", () => {\n    const ui = fs.readFileSync(path.join(process.cwd(), "components/features/FixedAssigneeReversePlanner.tsx"), "utf8");\n    assert.match(ui, /기존 배정 유지/);\n    assert.doesNotMatch(ui, /label: "기존 확정"/);\n  });\n'''
          if test not in s:
              if marker not in s:
                  raise SystemExit('test insertion marker not found')
              s = s.replace(marker, test + marker, 1)
              t.write_text(s, encoding='utf-8')
          PY
      - run: npm ci
      - name: Focused regression
        run: npx tsx --test tests/preliminary-survey-confirmed-document-repair.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/tmp-pr89-final-copy.yml
          git add components/features/FixedAssigneeReversePlanner.tsx tests/preliminary-survey-confirmed-document-repair.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: clarify existing preliminary survey assignment wording"
          git push origin HEAD:fix/reverse-planner-actual-date-cast

name: Apply canonical summary UI

on:
  push:
    branches:
      - feature/summary-canonical-ui-current-participants

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/summary-canonical-ui-current-participants

      - name: Transplant PR75 summary UI
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin bf6e7e1f54f42ef8d2b2433ea8352207d9590f72
          git fetch origin 0efdafb91833c2b4aef27b080b45a04436491cd0
          git diff bf6e7e1f54f42ef8d2b2433ea8352207d9590f72 0efdafb91833c2b4aef27b080b45a04436491cd0 -- \
            components/features/SummaryTable.tsx app/api/summary/route.ts > /tmp/pr75-summary-ui.patch
          git apply --3way /tmp/pr75-summary-ui.patch
          python3 scripts/apply_summary_canonical_ui.py
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit --pretty false --incremental false

      - name: Lint
        run: npm run lint

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-summary-canonical-ui.yml scripts/apply_summary_canonical_ui.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: align summary and journal role displays"
          git push origin HEAD:feature/summary-canonical-ui-current-participants

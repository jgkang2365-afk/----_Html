name: Apply admin override protection

on:
  push:
    branches:
      - fix/protect-admin-preliminary-override-final

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python scripts/patch-admin-override-protection.py
      - name: Install dependencies
        run: npm ci
      - name: Reverse planner regression
        run: npx tsx --test tests/preliminary-survey-reverse-planner.test.ts
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/preliminary-survey-v2/reverse-planner/route.ts \
            components/features/FixedAssigneeReversePlanner.tsx \
            docs/business-rules/preliminary-survey.md \
            lib/preliminary-survey-v2/reverse-planner/admin-override-protection.ts \
            lib/preliminary-survey-v2/reverse-planner/snapshot.ts \
            lib/preliminary-survey-v2/reverse-planner/solver.ts \
            lib/preliminary-survey-v2/reverse-planner/types.ts \
            tests/preliminary-survey-reverse-planner.test.ts
          git commit -m "fix: 관리자 예비조사 지정 편성 자동배정 보호"
          git push

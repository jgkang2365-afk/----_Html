name: Report Explorer Helper Stable Release

on:
  workflow_dispatch:
    inputs:
      pilot_tag:
        description: "Validated Pilot tag (report-explorer-helper-pilot-vX.Y.Z)"
        required: true
        type: string
      pilot_validation:
        description: "Enter PASS only after the required Windows Pilot PC validation."
        required: true
        type: string

permissions: {}

jobs:
  promote:
    if: github.ref == 'refs/heads/main' && inputs.pilot_validation == 'PASS'
    runs-on: windows-2025
    environment: report-explorer-stable
    permissions:
      contents: write
    steps:
      - name: Download and validate the exact Pilot assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PILOT_TAG: ${{ inputs.pilot_tag }}
        run: |
          if ($env:PILOT_TAG -notmatch '^report-explorer-helper-pilot-v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Invalid Pilot tag.' }
          $pilot = gh release view $env:PILOT_TAG --repo $env:GITHUB_REPOSITORY --json isPrerelease,targetCommitish | ConvertFrom-Json
          if (-not $pilot.isPrerelease) { throw 'Promotion source must be a Pilot prerelease.' }
          New-Item -ItemType Directory -Path release | Out-Null
          gh release download $env:PILOT_TAG --repo $env:GITHUB_REPOSITORY --dir release --pattern ReportExplorerHelper.exe --pattern ReportExplorerSetup.exe --pattern SHA256SUMS.txt --pattern release.json
          $manifest = Get-Content release/release.json -Raw | ConvertFrom-Json
          if ($manifest.channel -ne 'pilot' -or $manifest.releaseTag -ne $env:PILOT_TAG) { throw 'Pilot release.json channel/tag mismatch.' }
          $helperSha = (Get-FileHash release/ReportExplorerHelper.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupSha = (Get-FileHash release/ReportExplorerSetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($helperSha -ne $manifest.helperSha256 -or $setupSha -ne $manifest.setupSha256) { throw 'Pilot asset checksum mismatch.' }
          $expectedSums = Get-Content release/SHA256SUMS.txt -Raw
          if ($expectedSums -notmatch $helperSha -or $expectedSums -notmatch $setupSha) { throw 'Pilot SHA256SUMS mismatch.' }
          $stableTag = "report-explorer-helper-v$($manifest.helperVersion)"
          if (gh release view $stableTag --repo $env:GITHUB_REPOSITORY 2>$null) { throw "Stable Release already exists: $stableTag" }
          $stable = [ordered]@{ schemaVersion = $manifest.schemaVersion; product = $manifest.product; channel = 'stable'; releaseTag = $stableTag; helperVersion = $manifest.helperVersion; protocolVersion = $manifest.protocolVersion; setupVersion = $manifest.setupVersion; helperSha256 = $helperSha; setupSha256 = $setupSha; helperSize = $manifest.helperSize; sourceCommit = $manifest.sourceCommit; promotedFrom = $env:PILOT_TAG; publishedAt = [DateTime]::UtcNow.ToString('o') }
          [System.IO.File]::WriteAllText((Resolve-Path release).Path + '\release.json', ($stable | ConvertTo-Json -Compress) + "`n", [System.Text.UTF8Encoding]::new($false))
          "STABLE_TAG=$stableTag" >> $env:GITHUB_ENV
          "TARGET_COMMIT=$($manifest.sourceCommit)" >> $env:GITHUB_ENV
      - name: Publish exact Helper and Setup bytes as Stable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:STABLE_TAG release/ReportExplorerHelper.exe release/ReportExplorerSetup.exe release/SHA256SUMS.txt release/release.json --repo $env:GITHUB_REPOSITORY --target $env:TARGET_COMMIT --title $env:STABLE_TAG --notes "Promoted unchanged Helper and Setup assets from validated Pilot Release." --latest=false

name: Finalize current role mapping

on:
  push:
    branches:
      - feature/summary-canonical-ui-current-participants

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/summary-canonical-ui-current-participants

      - name: Apply exact-period role mapping guard
        shell: bash
        run: |
          set -euo pipefail
          # The repository line indentation differs from the staging script's first context.
          # Rewrite that one operation to remove only the historical request's current-role setter.
          python3 <<'PY'
          from pathlib import Path
          p = Path("scripts/finalize_current_role_mapping.py")
          s = p.read_text(encoding="utf-8")
          old = '''journal = replace_once(
              journal,
              '                const data = await response.json();\\n                setPreliminaryDisplay(data.preliminaryDisplay || null);\\n\\n                // 디버깅: 산재관리번호 확인',
              '                const data = await response.json();\\n\\n                // 디버깅: 산재관리번호 확인',
              "JournalEditForm historical request current-role race",
          )'''
          new = '''journal = replace_once(
              journal,
              '            setPreliminaryDisplay(data.preliminaryDisplay || null);\\n',
              '',
              "JournalEditForm historical request current-role race",
          )'''
          if old not in s:
              raise SystemExit("finalize script historical-setter patch context not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
          python3 scripts/finalize_current_role_mapping.py
          # Keep the pre-existing focused assertion aligned with the new dedicated current-role response field.
          python3 <<'PY'
          from pathlib import Path
          p = Path("tests/summary-journal-current-role-source.test.ts")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              r'/data\.preliminaryDisplay\.measurementParticipants/',
              r'/data\.currentMeasurementParticipants/',
          )
          p.write_text(s, encoding="utf-8")
          PY
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused role-source guard
        run: npx tsx --test tests/summary-journal-current-role-source.test.ts

      - name: Test
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit --pretty false --incremental false

      - name: Lint
        run: npm run lint

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-current-role-mapping.yml scripts/finalize_current_role_mapping.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: keep current role values period-exact"
          git push origin HEAD:feature/summary-canonical-ui-current-participants

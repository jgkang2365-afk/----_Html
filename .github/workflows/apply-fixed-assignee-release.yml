name: Apply fixed assignee release

on:
  push:
    branches:
      - fix/release-fixed-assignee-to-auto-impl

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python scripts/patch-fixed-assignee-release.py
      - name: Install dependencies
        run: npm ci
      - name: Focused regression
        run: npx tsx --test tests/preliminary-survey-fixed-assignee-release.test.ts tests/preliminary-survey-reverse-planner.test.ts
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/preliminary-survey-v2/reverse-planner/route.ts \
            components/features/FixedAssigneeReversePlanner.tsx \
            docs/business-rules/preliminary-survey.md \
            lib/preliminary-survey-v2/reverse-planner/types.ts \
            supabase/migrations/20260904103000_add_fixed_assignee_release.sql \
            tests/preliminary-survey-fixed-assignee-release.test.ts
          git commit -m "fix: 고정 측정자를 자동배정으로 되돌리기"
          git push

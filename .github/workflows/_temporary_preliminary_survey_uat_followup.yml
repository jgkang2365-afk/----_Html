name: Temporary preliminary survey UAT follow-up

on:
  push:
    branches:
      - fix/preliminary-survey-auto-assignment-review-ui
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-uat-followup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preliminary-survey-auto-assignment-review-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply approved UAT follow-up
        run: python .github/scripts/apply_preliminary_survey_uat_followup.py
      - name: Install dependencies
        run: npm ci
      - name: Focused regression tests
        run: npx tsx --test tests/preliminary-survey-reverse-planner.test.ts tests/preliminary-survey-route-lazy.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit implementation and remove temporary runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temporary_preliminary_survey_uat_followup.yml .github/scripts/apply_preliminary_survey_uat_followup.py
          git add docs/business-rules/preliminary-survey.md .env.example \
            lib/preliminary-survey-v2/reverse-planner/types.ts \
            lib/preliminary-survey-v2/reverse-planner/solver.ts \
            app/api/preliminary-survey-v2/reverse-planner/route.ts \
            components/features/FixedAssigneeReversePlanner.tsx \
            components/ui/Modal.tsx \
            tests/preliminary-survey-reverse-planner.test.ts
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: refine preliminary survey review UAT"
          git push origin HEAD:fix/preliminary-survey-auto-assignment-review-ui

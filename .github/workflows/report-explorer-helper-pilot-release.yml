name: Report Explorer Helper Pilot Release

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release-info.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate release source and version
        id: release-info
        shell: pwsh
        run: |
          if ($env:GITHUB_SHA -ne (git rev-parse origin/main)) { throw 'Pilot Release must run from current main.' }
          $source = (Get-Content tools/report-explorer-helper/report_explorer_versions.py -Raw).Replace("`r`n", "`n")
          $match = [regex]::Match($source, '(?m)^RELEASE_VERSION = "((0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))"$')
          if (-not $match.Success) { throw 'Canonical RELEASE_VERSION is missing or invalid.' }
          foreach ($name in @('HELPER_VERSION', 'UPDATER_VERSION', 'SETUP_VERSION')) { if ($source -notmatch "(?m)^${name} = RELEASE_VERSION$") { throw "$name must alias RELEASE_VERSION." } }
          $version = $match.Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=report-explorer-helper-pilot-v$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: tools/report-explorer-helper/requirements-build.lock
      - name: Install pinned build toolchain
        run: python -m pip install --disable-pip-version-check -r tools/report-explorer-helper/requirements-build.lock
      - name: Test Helper and updater
        run: python -m unittest discover -s tools/report-explorer-helper/tests -p "test_*.py" -v
      - name: Build Helper, Updater, and Setup
        shell: pwsh
        run: ./tools/report-explorer-helper/build-report-explorer-helper.ps1 -PythonExecutable (Get-Command python).Source
      - name: Create immutable pilot asset set
        shell: pwsh
        run: ./tools/report-explorer-helper/package-report-explorer-helper-release.ps1 -Channel pilot -SourceCommit $env:GITHUB_SHA
      - name: Validate canonical tag, manifest, and embedded versions
        shell: pwsh
        env:
          VERSION: ${{ steps.release-info.outputs.version }}
          TAG: ${{ steps.release-info.outputs.tag }}
        run: |
          $manifest = Get-Content tools/report-explorer-helper/release/release.json -Raw | ConvertFrom-Json
          if ($manifest.releaseTag -ne $env:TAG -or $manifest.channel -ne 'pilot') { throw 'Pilot manifest tag/channel mismatch.' }
          foreach ($field in @('releaseVersion', 'helperVersion', 'updaterVersion', 'setupVersion')) { if ($manifest.$field -ne $env:VERSION) { throw "Pilot manifest $field mismatch." } }
          if ($manifest.protocolVersion -ne '1' -or $manifest.sourceCommit -ne $env:GITHUB_SHA) { throw 'Pilot manifest protocol/source mismatch.' }
          foreach ($name in @('ReportExplorerHelper.exe', 'ReportExplorerSetup.exe')) {
            $embedded = [Diagnostics.FileVersionInfo]::GetVersionInfo("tools/report-explorer-helper/release/$name").ProductVersion
            if ($embedded -ne $env:VERSION) { throw "Embedded version mismatch: $name" }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: report-explorer-pilot-release
          if-no-files-found: error
          retention-days: 7
          path: |
            tools/report-explorer-helper/release/ReportExplorerHelper.exe
            tools/report-explorer-helper/release/ReportExplorerSetup.exe
            tools/report-explorer-helper/release/SHA256SUMS.txt
            tools/report-explorer-helper/release/release.json

  publish:
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: report-explorer-pilot-release
          path: release
      - name: Publish prerelease without rebuilding
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          if (gh release view $env:TAG --repo $env:GITHUB_REPOSITORY 2>$null) { throw "Release tag already exists: $env:TAG" }
          gh release create $env:TAG release/ReportExplorerHelper.exe release/ReportExplorerSetup.exe release/SHA256SUMS.txt release/release.json --repo $env:GITHUB_REPOSITORY --target $env:SHA --title $env:TAG --notes "Pilot artifact. Validate on a Pilot PC before Stable promotion." --prerelease --latest=false

name: Finalize preliminary survey multiday list

on:
  push:
    branches:
      - fix/preliminary-survey-list-multiday-dates

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[multiday-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Fix hook dependency
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("components/features/PreliminarySurveyV2Plans.tsx")
          text = p.read_text(encoding="utf-8")
          old = "  ), [activeKindFilter, activeMeasurementDateFrom, activeMeasurementDateTo, activeMethodFilter, activePreliminaryDateFilter, activeStatusFilter, drafts, rows]);"
          new = "  ), [activeKindFilter, activeMeasurementDateFrom, activeMeasurementDateTo, activeMethodFilter, activePreliminaryDateFilter, activeStatusFilter, drafts, mode, rows]);"
          if text.count(old) != 1:
              raise SystemExit(f"expected one filteredRows dependency list, found {text.count(old)}")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install dependencies
        run: npm ci
      - name: Focused regression
        run: npx tsx --test tests/preliminary-survey-list-multiday.test.ts tests/preliminary-survey-phase-b.test.ts
      - name: Full regression
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Diff check
        run: git diff --check
      - name: Commit final verification fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/features/PreliminarySurveyV2Plans.tsx
          git commit -m "test: finalize multiday list regression [multiday-final]"
          git push origin HEAD:fix/preliminary-survey-list-multiday-dates

name: Verify preliminary survey multiday list

on:
  push:
    branches:
      - fix/preliminary-survey-list-multiday-dates

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Focused regression
        run: npx tsx --test tests/preliminary-survey-list-multiday.test.ts tests/preliminary-survey-phase-b.test.ts
      - name: Full regression
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check origin/main...HEAD
